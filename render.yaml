# Creates a NEW service. Supply credentials for a NEW Supabase project.
services:
  - type: web
    name: aimi-android-api
    runtime: node
    plan: starter
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm run build:api
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_DEV_AUTH
        value: "false"
      - key: ENABLE_TEST_DEMO
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        value: https://localhost
      - key: AIMI_CONTENT_SOURCE
        value: bundled
      - key: AIMI_RELEASE_VERSION
        value: prototype-v1-reviewed
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SESSION_SIGNING_KEY
        generateValue: true
      - key: AIMI_GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.1-flash-lite
